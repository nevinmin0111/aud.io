name: Build aud.io

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore SoundDesk.csproj
      - name: Compile check
        run: dotnet build SoundDesk.csproj --configuration Release --no-restore
      - name: Publish standalone app
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet publish SoundDesk.csproj --configuration Release --no-restore --output publish
      - name: Create download zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath aud.io-windows-x64.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: aud.io-windows-x64.zip
          generate_release_notes: true
